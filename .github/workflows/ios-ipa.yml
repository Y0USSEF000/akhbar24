# Builds the iPhone app file (Akhbar24.ipa) on a free GitHub Mac.
# The .ipa is NOT signed: Sideloadly signs it with your Apple ID when it installs it on the iPhone.
# Start it from GitHub: Actions -> "Build iPhone app (.ipa)" -> Run workflow.
name: Build iPhone app (.ipa)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install packages
        run: npm ci

      - name: Create the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build the app (without signing)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -80

      - name: Pack Akhbar24.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry Akhbar24.ipa Payload
          ls -lh Akhbar24.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Akhbar24-ipa
          path: Akhbar24.ipa
          retention-days: 30
